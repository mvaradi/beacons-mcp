[project]
name = "beacons-mcp"
version = "0.1.0"
description = "MCP server exposing the 3D-Beacons protein structure API to AI agents."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mihaly Varadi", email = "24314338+mvaradi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pydantic>=2",
]

[project.scripts]
beacons-mcp = "beacons_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp[cli]>=2.3,<3",
    "pytest",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the real UniProt and 3D-Beacons services; run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: calls the real UniProt / 3D-Beacons services (skipped by default)",
]
